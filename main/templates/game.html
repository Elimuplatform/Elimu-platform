<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Fighter Game - Elimu Platform</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        #gameCanvas {
            background: linear-gradient(to bottom, #020617, #1e1b4b);
            border: 3px solid #38bdf8;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            display: block;
            margin: 15px auto;
        }

        .controls-info {
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 10px;
            font-size: 14px;
        }

        .btn-back {
            display: inline-block;
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <a href="{% url 'home' %}" class="btn-back">⬅ Rudi Home</a>
    <h1>🚀 Ndege ya Kivita - Mapumziko Game</h1>
    <p>Cheza game kutoka kwa SIR NYUKI kupunguza uchovu wa masomo!</p>

    <!-- Canvas ya Game -->
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="controls-info">
        🎮 <strong>Jinsi ya Kucheza:</strong> 
        Tumia Vitufe vya Arrow (<strong>Left / Right</strong>) kusogeza Ndege | Tumia <strong>SPACEBAR</strong> kupiga Risasi
    </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    if (canvas) {
        const ctx = canvas.getContext("2d");

        let jet = { x: canvas.width / 2 - 20, y: canvas.height - 45, width: 40, height: 40, speed: 6 };
        let bullets = [];
        let obstacles = [];
        let particles = []; // Kwa ajili ya maripuko ya moto
        let score = 0;
        let level = 1;
        let gameOver = false;
        let keys = {};

        window.addEventListener("keydown", (e) => {
            if (["Space", "ArrowLeft", "ArrowRight"].includes(e.code)) {
                e.preventDefault();
            }
            keys[e.code] = true;
            if (e.code === "Space" && !gameOver) {
                // Risasi ya Moto
                bullets.push({ x: jet.x + jet.width / 2 - 3, y: jet.y, width: 6, height: 14, speed: 9 });
            }
            if (e.code === "KeyR" && gameOver) {
                restartGame();
            }
        });

        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        // 1. Kutengeneza Vikwazo vya Parachuti (Speed Imepunguzwa)
        function spawnObstacle() {
            if (gameOver) return;
            // Kasi ndogo ya kushuka (Slow falling speed)
            let speed = 0.8 + level * 0.4; 
            obstacles.push({ x: Math.random() * (canvas.width - 40), y: -40, width: 36, height: 36, speed: speed });
        }

        setInterval(spawnObstacle, 1400);

        // 2. Kutengeneza Kamripuko ka Moto (Explosion Effect)
        function createExplosion(x, y) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    radius: Math.random() * 4 + 2,
                    color: ["#ff4500", "#ffa500", "#ffff00", "#ff0000"][Math.floor(Math.random() * 4)],
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 20
                });
            }
        }

        function update() {
            if (gameOver) return;

            if (keys["ArrowLeft"] && jet.x > 0) jet.x -= jet.speed;
            if (keys["ArrowRight"] && jet.x < canvas.width - jet.width) jet.x += jet.speed;

            // Kusogeza Risasi
            bullets.forEach((bullet, bIndex) => {
                bullet.y -= bullet.speed;
                if (bullet.y < 0) bullets.splice(bIndex, 1);
            });

            // Kusogeza Parachuti
            obstacles.forEach((obs, oIndex) => {
                obs.y += obs.speed;

                if (obs.y > canvas.height) gameOver = true;

                // Risasi kugonga Parachuti
                bullets.forEach((bullet, bIndex) => {
                    if (bullet.x < obs.x + obs.width && bullet.x + bullet.width > obs.x &&
                        bullet.y < obs.y + obs.height && bullet.y + bullet.height > obs.y) {
                        
                        // Tengeneza Mripuko wa Moto hapa
                        createExplosion(obs.x + obs.width / 2, obs.y + obs.height / 2);

                        obstacles.splice(oIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;

                        if (score >= 50 && score < 120) level = 2;
                        if (score >= 120) level = 3;
                    }
                });

                if (jet.x < obs.x + obs.width && jet.x + jet.width > obs.x &&
                    jet.y < obs.y + obs.height && jet.y + jet.height > obs.y) {
                    createExplosion(jet.x + jet.width / 2, jet.y + jet.height / 2);
                    gameOver = true;
                }
            });

            // Update Mripuko (Particles)
            particles.forEach((p, pIndex) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(pIndex, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // A. Chora Ndege
            ctx.fillStyle = "#38bdf8";
            ctx.beginPath();
            ctx.moveTo(jet.x + jet.width / 2, jet.y);
            ctx.lineTo(jet.x + jet.width, jet.y + jet.height);
            ctx.lineTo(jet.x, jet.y + jet.height);
            ctx.closePath();
            ctx.fill();

            // B. Chora Risasi za Moto (Fire Lasers)
            bullets.forEach((b) => {
                let gradient = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.height);
                gradient.addColorStop(0, "#ffffff");
                gradient.addColorStop(0.3, "#ffff00");
                gradient.addColorStop(1, "#ff3300");
                ctx.fillStyle = gradient;
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            // C. Chora Vikwazo vya PARACHUTI
            obstacles.forEach((o) => {
                // Dome la Parachuti
                ctx.fillStyle = level === 1 ? "#ef4444" : level === 2 ? "#f97316" : "#a855f7";
                ctx.beginPath();
                ctx.arc(o.x + o.width / 2, o.y + 12, 16, Math.PI, 0, false);
                ctx.closePath();
                ctx.fill();

                // Kamba za Parachuti
                ctx.strokeStyle = "#cbd5e1";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(o.x + 2, o.y + 12);
                ctx.lineTo(o.x + o.width / 2, o.y + o.height);
                ctx.moveTo(o.x + o.width - 2, o.y + 12);
                ctx.lineTo(o.x + o.width / 2, o.y + o.height);
                ctx.stroke();

                // Mzigo chini ya Parachuti
                ctx.fillStyle = "#64748b";
                ctx.fillRect(o.x + o.width / 2 - 4, o.y + o.height - 4, 8, 8);
            });

            // D. Chora Kamripuko ka Moto (Particles)
            particles.forEach((p) => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // E. Score na Level
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 14px Arial";
            ctx.fillText(`Score: ${score}`, 15, 25);
            ctx.fillText(`LEVEL: ${level}`, canvas.width - 90, 25);

            // F. Game Over Screen
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ef4444";
                ctx.font = "26px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER!", canvas.width / 2, canvas.height / 2 - 10);

                ctx.fillStyle = "#ffffff";
                ctx.font = "15px Arial";
                ctx.fillText(`Score Yako: ${score} | Umefika Level ${level}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText("Bonyeza 'R' Kuanza Tena", canvas.width / 2, canvas.height / 2 + 50);
                ctx.textAlign = "left";
            }
        }

        function restartGame() {
            score = 0; level = 1; obstacles = []; bullets = []; particles = []; gameOver = false;
            jet.x = canvas.width / 2 - 20;
        }

        function loop() {
            update(); draw(); requestAnimationFrame(loop);
        }
        loop();
    }
</script>
</body>
</html>
