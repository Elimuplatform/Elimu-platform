{% load static %}
<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Jet Fighter - Sir Nyuki</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 90vh;
            max-height: 800px;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
            border: 2px solid #30363d;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        /* Touch Controls */
        #touch-controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 5px;
        }
        .touch-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            touch-action: none;
        }
        .touch-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.4);
        }
        #fire-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(231, 76, 60, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.6);
            font-weight: bold;
            font-size: 16px;
            align-self: flex-end;
        }
        /* Game Over Screen */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            display: none;
        }
        #game-over h1 {
            color: #e74c3c;
            font-size: 36px;
            margin-bottom: 10px;
        }
        #restart-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
        }
        /* Popup Congratulation Banner */
        #congrat-popup {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #f1c40f;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: #f1c40f;
            font-size: 20px;
            font-weight: bold;
            z-index: 15;
            transition: transform 0.3s ease-in-out;
            pointer-events: none;
            box-shadow: 0 0 25px rgba(241, 196, 15, 0.8);
            width: 85%;
        }
        #congrat-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div>SCORE: <span id="score">0</span></div>
        <div>HP: <span id="hp">100</span>%</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="congrat-popup">
        🎉 CONGRATULATION FROM SIR NYUKI! 🎉
    </div>

    <div id="touch-controls">
        <div class="dpad">
            <div></div>
            <div class="touch-btn" id="btn-up">▲</div>
            <div></div>
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-down">▼</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="touch-btn" id="fire-btn">FIRE</div>
    </div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="restart-btn" onclick="resetGame()">PLAY AGAIN</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

function resizeCanvas() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Web Audio API for Sound Effects
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'explosion') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
    } else if (type === 'congrat') {
        const now = audioCtx.currentTime;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.setValueAtTime(600, now + 0.1);
        osc.frequency.setValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
    }
}

let score = 0;
let lastMilestone = 0;
let gameOver = false;
let propAngle = 0;

const player = {
    x: canvas.width / 2 - 25,
    y: canvas.height - 120,
    width: 50,
    height: 50,
    speed: 5,
    hp: 100,
    dx: 0,
    dy: 0
};

let bullets = [];
let enemyBullets = [];
let enemies = [];
let clouds = [];
let particles = [];

for (let i = 0; i < 5; i++) {
    clouds.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        speed: 0.5 + Math.random() * 0.8,
        radius: 30 + Math.random() * 20
    });
}

const keys = {};
window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'f') shoot();
});
window.addEventListener('keyup', e => keys[e.key] = false);

function bindTouch(id, dx, dy) {
    const btn = document.getElementById(id);
    const start = (e) => { e.preventDefault(); player.dx = dx * player.speed; player.dy = dy * player.speed; };
    const end = (e) => { e.preventDefault(); player.dx = 0; player.dy = 0; };
    btn.addEventListener('touchstart', start);
    btn.addEventListener('touchend', end);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
}
bindTouch('btn-up', 0, -1);
bindTouch('btn-down', 0, 1);
bindTouch('btn-left', -1, 0);
bindTouch('btn-right', 1, 0);

const fireBtn = document.getElementById('fire-btn');
fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
fireBtn.addEventListener('mousedown', (e) => { e.preventDefault(); shoot(); });

function shoot() {
    if (gameOver) return;
    bullets.push({
        x: player.x + player.width / 2 - 3,
        y: player.y,
        width: 6,
        height: 14,
        speed: 8
    });
    playSound('shoot');
}

function spawnEnemy() {
    if (gameOver) return;
    enemies.push({
        x: Math.random() * (canvas.width - 40),
        y: -50,
        width: 44,
        height: 44,
        speed: 1.5 + Math.random() * 2,
        lastShoot: Date.now(),
        shootInterval: 1500 + Math.random() * 2000
    });
}
setInterval(spawnEnemy, 1800);

function triggerCelebration() {
    playSound('congrat');
    const popup = document.getElementById('congrat-popup');
    popup.classList.add('show');
    setTimeout(() => {
        popup.classList.remove('show');
    }, 2500);

    for (let i = 0; i < 60; i++) {
        particles.push({
            x: canvas.width / 2,
            y: canvas.height / 3,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            color: `hsl(${Math.random() * 360}, 100%, 50%)`,
            radius: 4 + Math.random() * 4,
            alpha: 1,
            life: 60
        });
    }
}

function drawBackgroundText() {
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center';

    let text = "REFRESH MIND WITH SIR NYUKI";
    let spacing = 120;
    for (let y = 50; y < canvas.height + 100; y += spacing) {
        ctx.fillText(text, canvas.width / 2, y);
    }
    ctx.restore();
}

function drawAviatorPlane(x, y, w, h) {
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);

    ctx.fillStyle = '#dc2626';
    ctx.fillRect(-w / 2, -h / 6, w, h / 5);

    ctx.fillStyle = '#b91c1c';
    ctx.beginPath();
    ctx.moveTo(0, -h / 2);
    ctx.lineTo(w / 4, h / 3);
    ctx.lineTo(0, h / 2);
    ctx.lineTo(-w / 4, h / 3);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#991b1b';
    ctx.fillRect(-w / 4, h / 3, w / 2, h / 8);

    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(0, -h / 8, w / 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(0, -h / 2, 4, 0, Math.PI * 2);
    ctx.fill();

    propAngle += 0.4;
    ctx.save();
    ctx.translate(0, -h / 2);
    ctx.rotate(propAngle);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.fillRect(-w / 3, -2, (w * 2) / 3, 4);
    ctx.restore();

    ctx.restore();
}

function drawEnemyPlane(enemy) {
    ctx.save();
    ctx.translate(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);

    ctx.fillStyle = '#475569';
    ctx.beginPath();
    ctx.moveTo(0, enemy.height / 2);
    ctx.lineTo(enemy.width / 2, -enemy.height / 4);
    ctx.lineTo(-enemy.width / 2, -enemy.height / 4);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#1e293b';
    ctx.fillRect(-enemy.width / 6, -enemy.height / 2, enemy.width / 3, enemy.height);

    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-enemy.width / 8, -enemy.height / 2 - 3, enemy.width / 4, 3);

    ctx.restore();
}

function drawCloud(c) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
    ctx.arc(c.x + c.radius * 0.6, c.y - c.radius * 0.2, c.radius * 0.7, 0, Math.PI * 2);
    ctx.arc(c.x - c.radius * 0.6, c.y - c.radius * 0.2, c.radius * 0.7, 0, Math.PI * 2);
    ctx.fill();
}

function update() {
    if (gameOver) return;

    if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
    if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

    player.x += player.dx;
    player.y += player.dy;

    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

    clouds.forEach(c => {
        c.y += c.speed;
        if (c.y - c.radius > canvas.height) {
            c.y = -c.radius * 2;
            c.x = Math.random() * canvas.width;
        }
    });

    bullets.forEach((b, index) => {
        b.y -= b.speed;
        if (b.y < -20) bullets.splice(index, 1);
    });

    enemies.forEach((e, eIndex) => {
        e.y += e.speed;

        if (Date.now() - e.lastShoot > e.shootInterval) {
            enemyBullets.push({
                x: e.x + e.width / 2 - 3,
                y: e.y + e.height,
                width: 6,
                height: 12,
                speed: 5
            });
            e.lastShoot = Date.now();
        }

        bullets.forEach((b, bIndex) => {
            if (b.x < e.x + e.width && b.x + b.width > e.x &&
                b.y < e.y + e.height && b.y + b.height > e.y) {
                enemies.splice(eIndex, 1);
                bullets.splice(bIndex, 1);
                score += 10;
                document.getElementById('score').innerText = score;
                playSound('explosion');

                if (score > 0 && score % 50 === 0 && score !== lastMilestone) {
                    lastMilestone = score;
                    triggerCelebration();
                }
            }
        });

        if (player.x < e.x + e.width && player.x + player.width > e.x &&
            player.y < e.y + e.height && player.y + player.height > e.y) {
            enemies.splice(eIndex, 1);
            takeDamage(20);
            playSound('explosion');
        }

        if (e.y > canvas.height + 50) enemies.splice(eIndex, 1);
    });

    enemyBullets.forEach((eb, ebIndex) => {
        eb.y += eb.speed;

        if (eb.x < player.x + player.width && eb.x + eb.width > player.x &&
            eb.y < player.y + player.height && eb.y + eb.height > player.y) {
            enemyBullets.splice(ebIndex, 1);
            takeDamage(10);
            playSound('explosion');
        }

        if (eb.y > canvas.height + 20) enemyBullets.splice(ebIndex, 1);
    });

    particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        p.alpha = p.life / 60;
        if (p.life <= 0) particles.splice(index, 1);
    });

    draw();
    requestAnimationFrame(update);
}

function takeDamage(amount) {
    player.hp -= amount;
    if (player.hp < 0) player.hp = 0;
    document.getElementById('hp').innerText = player.hp;

    if (player.hp <= 0) {
        gameOver = true;
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over').style.display = 'flex';
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackgroundText();
    clouds.forEach(drawCloud);
    drawAviatorPlane(player.x, player.y, player.width, player.height);

    ctx.fillStyle = '#38bdf8';
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

    enemies.forEach(drawEnemyPlane);

    ctx.fillStyle = '#ef4444';
    enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.width, eb.height));

    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function resetGame() {
    score = 0;
    lastMilestone = 0;
    player.hp = 100;
    player.x = canvas.width / 2 - 25;
    player.y = canvas.height - 120;
    bullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    gameOver = false;
    document.getElementById('score').innerText = '0';
    document.getElementById('hp').innerText = '100';
    document.getElementById('game-over').style.display = 'none';
    update();
}

update();
</script>
</body>
</html>
