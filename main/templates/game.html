<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jet Fighter - Elimu Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        #gameCanvas {
            background: linear-gradient(to bottom, #020617, #0f172a);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            touch-action: none;
        }
.touch-btn:active {
    transform: scale(0.95);
}
.touch-btn {
    transition: transform 0.05s ease;
    touch-action: none;
}
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 md:p-6 overflow-x-hidden">

    <!-- Header -->
    <header class="w-full max-w-2xl text-center my-2">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-blue-400">✈️ JET FIGHTER</h1>
        <p class="text-xs md:text-sm text-slate-400">Elimu Platform Special Edition</p>
    </header>

    <!-- Canvas Wrapper -->
    <main class="w-full max-w-2xl flex flex-col items-center justify-center relative flex-grow">
        <canvas id="gameCanvas" class="w-full rounded-xl border border-slate-700 max-h-[60vh] object-contain"></canvas>
    </main>

    <!-- On-Screen Mobile Touch Controls -->
    <footer id="mobile-controls" class="w-full max-w-md my-3 px-2 grid grid-cols-3 gap-2 items-center">
        <!-- Directional D-Pad Left Side -->
        <div class="col-span-2 grid grid-cols-3 gap-1.5 text-center">
            <div></div>
            <button id="btnUp" class="touch-btn bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 rounded-lg border border-slate-600 shadow-lg text-lg">⬆️</button>
            <div></div>
            <button id="btnLeft" class="touch-btn bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 rounded-lg border border-slate-600 shadow-lg text-lg">⬅️</button>
            <button id="btnDown" class="touch-btn bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 rounded-lg border border-slate-600 shadow-lg text-lg">⬇️</button>
            <button id="btnRight" class="touch-btn bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 rounded-lg border border-slate-600 shadow-lg text-lg">➡️</button>
        </div>

        <!-- Action Attack Button Right Side -->
        <div class="col-span-1 flex flex-col justify-center h-full">
            <button id="btnShoot" class="touch-btn bg-red-600 active:bg-red-700 text-white font-extrabold py-8 rounded-xl border border-red-500 shadow-xl text-xl flex items-center justify-center gap-1">
                🔥 <span>PIGA</span>
            </button>
        </div>
    </footer>

    <script>
        // Game Canvas & Context Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Internal logical resolution
        canvas.width = 800;
        canvas.height = 450;

        // Game State Variables
        let score = 0;
        let level = 1;
        let gameOver = false;

        // Player Jet Object
        const jet = {
            x: 100,
            y: canvas.height / 2 - 20,
            width: 40,
            height: 25,
            speed: 6,
            dx: 0,
            dy: 0
        };

        // Key press tracking (Keyboards & Touch)
        const keys = {
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };

        // Entities Arrays
        let bullets = [];
        let obstacles = [];
        let particles = [];

        // Timers & Intervals
        let obstacleSpawnTimer = 0;
        let lastShootTime = 0;

        // Keyboard Controllers
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.ArrowUp = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.ArrowDown = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = true;
            if (e.code === 'Space') {
                if (!keys.Space) shootBullet();
                keys.Space = true;
            }
            if (e.code === 'KeyR' && gameOver) restartGame();
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.ArrowUp = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.ArrowDown = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = false;
            if (e.code === 'Space') keys.Space = false;
        });

        // Touch Control Helper Function
        function bindTouchControl(elementId, actionKey) {
            const btn = document.getElementById(elementId);
            if (!btn) return;

            const handleStart = (e) => {
                e.preventDefault();
                if (gameOver) {
                    restartGame();
                    return;
                }
                if (actionKey === 'Space') {
                    shootBullet();
                } else {
                    keys[actionKey] = true;
                }
            };

            const handleEnd = (e) => {
                e.preventDefault();
                if (actionKey !== 'Space') {
                    keys[actionKey] = false;
                }
            };

            btn.addEventListener('touchstart', handleStart, { passive: false });
            btn.addEventListener('touchend', handleEnd, { passive: false });
            btn.addEventListener('mousedown', handleStart);
            btn.addEventListener('mouseup', handleEnd);
        }

        // Attach On-Screen Controls
        bindTouchControl('btnUp', 'ArrowUp');
        bindTouchControl('btnDown', 'ArrowDown');
        bindTouchControl('btnLeft', 'ArrowLeft');
        bindTouchControl('btnRight', 'ArrowRight');
        bindTouchControl('btnShoot', 'Space');

        // Restart on canvas tap when game over
        canvas.addEventListener('touchstart', (e) => {
            if (gameOver) {
                e.preventDefault();
                restartGame();
            }
        });

        // Shooting Logic
        function shootBullet() {
            const now = Date.now();
            if (now - lastShootTime < 150) return; // Fire rate limit
            lastShootTime = now;

            bullets.push({
                x: jet.x + jet.width,
                y: jet.y + jet.height / 2 - 3,
                width: 12,
                height: 6,
                speed: 10
            });
        }

        // Create Particles for Explosions
        function createExplosion(x, y, color = '#f97316') {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 20
                });
            }
        }

        // Spawn Enemy Drone/Obstacle
        function spawnObstacle() {
            const size = Math.random() * 20 + 20;
            obstacles.push({
                x: canvas.width + 30,
                y: Math.random() * (canvas.height - size - 20) + 10,
                width: size,
                height: size,
                speed: Math.random() * 2 + 3 + (level * 0.5)
            });
        }

        // Update Game Frame
        function update() {
            if (gameOver) return;

            // Movement handling
            if (keys.ArrowUp && jet.y > 5) jet.y -= jet.speed;
            if (keys.ArrowDown && jet.y < canvas.height - jet.height - 5) jet.y += jet.speed;
            if (keys.ArrowLeft && jet.x > 5) jet.x -= jet.speed;
            if (keys.ArrowRight && jet.x < canvas.width - jet.width - 5) jet.x += jet.speed;

            // Bullets movement
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].speed;
                if (bullets[i].x > canvas.width) {
                    bullets.splice(i, 1);
                }
            }

            // Spawn obstacles
            obstacleSpawnTimer++;
            if (obstacleSpawnTimer > Math.max(30, 90 - level * 5)) {
                spawnObstacle();
                obstacleSpawnTimer = 0;
            }

            // Obstacles movement & collisions
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= obs.speed;

                // Check collision with player jet
                if (
                    jet.x < obs.x + obs.width &&
                    jet.x + jet.width > obs.x &&
                    jet.y < obs.y + obs.height &&
                    jet.y + jet.height > obs.y
                ) {
                    createExplosion(jet.x + jet.width / 2, jet.y + jet.height / 2, '#ef4444');
                    gameOver = true;
                }

                // Check collision with bullets
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (
                        b.x < obs.x + obs.width &&
                        b.x + b.width > obs.x &&
                        b.y < obs.y + obs.height &&
                        b.y + b.height > obs.y
                    ) {
                        createExplosion(obs.x + obs.width / 2, obs.y + obs.height / 2);
                        obstacles.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;

                        // Level Up
                        if (score % 50 === 0) level++;
                        break;
                    }
                }

                // Remove offscreen obstacles
                if (obs && obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // Particles update
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // Draw Everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Stars / Background details
            ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
            for (let i = 0; i < 20; i++) {
                ctx.fillRect((i * 43) % canvas.width, (i * 71) % canvas.height, 2, 2);
            }

            // Draw Player Jet
            ctx.fillStyle = "#3b82f6"; // Body
            ctx.beginPath();
            ctx.moveTo(jet.x, jet.y);
            ctx.lineTo(jet.x + jet.width, jet.y + jet.height / 2);
            ctx.lineTo(jet.x, jet.y + jet.height);
            ctx.closePath();
            ctx.fill();

            // Cockpit
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(jet.x + 10, jet.y + 7, 12, 10);

            // Thruster Flame
            ctx.fillStyle = "#f97316";
            ctx.fillRect(jet.x - 8, jet.y + 8, 8, 9);

            // Draw Bullets
            ctx.fillStyle = "#facc15";
            bullets.forEach(b => {
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            // Draw Obstacles (Enemy Drones)
            ctx.fillStyle = "#ef4444";
            obstacles.forEach(o => {
                ctx.fillRect(o.x, o.y, o.width, o.height);
                ctx.fillStyle = "#991b1b";
                ctx.fillRect(o.x + 4, o.y + 4, o.width - 8, o.height - 8);
                ctx.fillStyle = "#ef4444";
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw HUD (Score & Level)
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px Arial";
            ctx.fillText(`Score: ${score}`, 20, 30);
            ctx.fillText(`Level: ${level}`, canvas.width - 100, 30);

            // Draw Game Over Screen
            if (gameOver) {
                ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ef4444";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#ffffff";
                ctx.font = "18px Arial";
                ctx.fillText(`Score Yako: ${score} | Umefika Level ${level}`, canvas.width / 2, canvas.height / 2 + 20);
                
                ctx.fillStyle = "#38bdf8";
                ctx.font = "bold 16px Arial";
                ctx.fillText("Bonyeza Hapa au 'Piga' Kuanza Tena", canvas.width / 2, canvas.height / 2 + 60);
                
                ctx.textAlign = "left"; // Reset alignment
            }
        }

        // Restart Game State
        function restartGame() {
            score = 0;
            level = 1;
            obstacles = [];
            bullets = [];
            particles = [];
            jet.y = canvas.height / 2 - 20;
            jet.x = 100;
            gameOver = false;
        }

        // Main Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start game when page loads
        window.onload = function() {
            loop();
        };
    </script>
</body>
</html>
