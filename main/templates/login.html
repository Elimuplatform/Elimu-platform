<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Ingia Mfumoni - Elimu Platform</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #0056b3; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 5px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        button:hover { background: #003d80; }
        .alert { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 10px; font-size: 14px; }
        .success { background: #d4edda; color: #155724; }
        .toggle-btn { text-align: center; margin-top: 15px; font-size: 14px; cursor: pointer; color: #0056b3; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="box">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'success' %}success{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <!-- FOMU YA LOGIN -->
        <div id="login-form">
            <h2>Ingia Mfumoni</h2>
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Jina la Mtumiaji (Username)" required>
                <input type="password" name="password" placeholder="Nenosiri (Password)" required>
                <button type="submit" name="login">Ingia</button>
            </form>
            <div class="toggle-btn" onclick="toggleForm()">Huna Akaunti? Jisajili Hapa</div>
        </div>

        <!-- FOMU YA USAJILI -->
        <div id="register-form" style="display: none;">
            <h2>Tengeneza Akaunti</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="text" name="phone" placeholder="Namba ya Simu" required>
                <label style="font-size: 12px; font-weight: bold; margin-top: 5px; display: block;">Passport Photo:</label>
                <input type="file" name="passport_photo" accept="image/*" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" name="register">Sajili</button>
            </form>
            <div class="toggle-btn" onclick="toggleForm()">Tayari una Akaunti? Ingia Hapa</div>
        </div>
    </div>

    <script>
        function toggleForm() {
            var loginBox = document.getElementById('login-form');
            var regBox = document.getElementById('register-form');
            if (loginBox.style.display === 'none') {
                loginBox.style.display = 'block';
                regBox.style.display = 'none';
            } else {
                loginBox.style.display = 'none';
                regBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
