<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Elimu Platform{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Brand Logo -->
                <div class="flex items-center space-x-3">
                    <div class="p-2 bg-indigo-500 rounded-lg shadow-inner">
                        <i class="fa-solid font-bold text-2xl fa-graduation-cap"></i>
                    </div>
                    <a href="/" class="font-extrabold text-2xl tracking-wide">Elimu<span class="text-yellow-400">Platform</span></a>
                </div>

                <!-- Navigation Links -->
                <div class="hidden md:flex space-x-6 font-medium">
                    <a href="/" class="hover:text-yellow-300 transition duration-200"><i class="fa-solid fa-house mr-1"></i> Nyumbani</a>
                    <a href="/notes/" class="hover:text-yellow-300 transition duration-200"><i class="fa-solid fa-book-open mr-1"></i> Masomo & Notes</a>
                    <a href="/ai-tutor/" class="hover:text-yellow-300 transition duration-200"><i class="fa-solid fa-robot mr-1"></i> AI Tutor</a>
                    <a href="/games/" class="hover:text-yellow-300 transition duration-200"><i class="fa-solid fa-gamepad mr-1"></i> Educational Games</a>
                </div>

                <!-- Profile / Login Button -->
                <div>
                    <a href="/login/" class="bg-yellow-400 text-indigo-900 font-semibold px-4 py-2 rounded-xl shadow hover:bg-yellow-300 transition duration-200">
                        <i class="fa-solid fa-user-check mr-1"></i> Ingia
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Body -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Modern Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-sm">&copy; 2026 Elimu Platform. Haki zote zimehifadhiwa.</p>
            <p class="text-xs text-slate-500 mt-2">Elimu Bora na ya Kisasa Kwa Wote</p>
        </div>
    </footer>

</body>
</html>
